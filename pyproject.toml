[tool.poetry]
name = "setiastrosuitepro-yeti"
version = "1.16.4.yeti1"
description = "Seti Astro Suite Pro - YETI Edition: No sippy cups, just proper packaging"
authors = ["Franklin Marek <frank@setiastro.com>", "YETI Edition Maintainers"]
readme = "README.YETI.md"
license = "GPL-3.0"
homepage = "https://github.com/VincentJGeisler/setiastrosuitepro-yeti"
repository = "https://github.com/VincentJGeisler/setiastrosuitepro-yeti"
keywords = ["astrophotography", "astronomy", "image-processing", "photometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
packages = [{include = "setiastro", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
# numeric & scientific
numpy = "*"
scipy = "*"
pywavelets = "*"
matplotlib = "*"
plotly = "*"
exifread = "*"
lightkurve = "*"
oktopus = "*"

# tables & I/O
pandas = "*"
tifffile = "*"
Pillow = "*"

# networking & web
requests = "*"
astroquery = "*"

# compression
lz4 = "*"
zstandard = "*"
imagecodecs = "*"

# astronomy
astropy = "*"
photutils = "*"
sep = "*"
reproject = "*"
tzlocal = "*"
skyfield = "*"
jplephem = "*"
GaiaXPy = "^2.1.4"

# performance
numba = "*"

# neural net / GPU acceleration
# NOTE: PyTorch must be installed separately with appropriate backend:
# - CUDA: pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
# - CPU:  pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
# We don't include it as a dependency to let users choose their backend
onnx = "*"
# Use GPU version on Linux, DirectML on Windows, CPU version on macOS/others
# Note: onnxruntime-gpu includes CUDA support and also provides CPUExecutionProvider as fallback
# You cannot install both onnxruntime and onnxruntime-gpu simultaneously
"onnxruntime-gpu" = [
    {version = ">=1.19.0,<1.25.0", markers = "sys_platform == 'linux' and python_version == '3.10'"},
    {version = ">=1.25.0", markers = "sys_platform == 'linux' and python_version >= '3.11'"}
]
"onnxruntime-directml" = {version = ">=1.20.0", markers = "sys_platform == 'win32'"}
onnxruntime = {version = ">=1.19.0", markers = "sys_platform != 'linux' and sys_platform != 'win32'"}

# image formats & camera raw
xisf = "*"
rawpy = ">=0.26.0"
imageio = "*"

# PDF support
pypdfium2 = "*"

# utilities
pytz = "*"
py-cpuinfo = "*"

# GUI
PyQt6 = "*"
pyqtgraph = "*"

# system
psutil = "*"

# computer vision
opencv-python-headless = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
# Optional extras can be added here if needed in the future

[tool.poetry.scripts]
setiastrosuitepro = "setiastro.saspro.__main__:main"
cosmicclarity = "setiastro.saspro.cli:main"
saspro-export-requirements = "ops.export_requirements:main"
saspro-write-build-info = "ops.write_build_info:main"
saspro-prime-matplotlib-cache = "ops.prime_matplotlib_cache:main"

