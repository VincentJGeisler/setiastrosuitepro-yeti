[tool.poetry]
name = "setiastrosuitepro-yeti"
version = "1.21.4+yeti1"
description = "Seti Astro Suite Pro - YETI Edition: No sippy cups, just proper packaging"
authors = ["Franklin Marek <frank@setiastro.com>", "YETI Edition Maintainers"]
readme = "README.YETI.md"
license = "GPL-3.0"
homepage = "https://github.com/VincentJGeisler/setiastrosuitepro-yeti"
repository = "https://github.com/VincentJGeisler/setiastrosuitepro-yeti"
keywords = ["astrophotography", "astronomy", "image-processing", "photometry"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Astronomy",
]
packages = [{include = "setiastro", from = "src"}]
include = [
    {path = "src/setiastro/saspro/legacy/resources/*.icc", format = ["sdist", "wheel"]},
    {path = "src/setiastro/saspro/icc_profiles/*", format = ["sdist", "wheel"]},
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
# numeric & scientific
numpy = "*"
scipy = "*"
pywavelets = "*"
matplotlib = "*"
plotly = "*"
exifread = "*"
lightkurve = "*"
oktopus = "*"
PyOpenGL = "*"

# tables & I/O
pandas = "*"
tifffile = "*"
Pillow = "*"

# networking & web
requests = "*"
astroquery = "*"

# compression
lz4 = "*"
zstandard = "*"
imagecodecs = "*"

# astronomy
astropy = "*"
photutils = "*"
sep = "*"
reproject = "*"
tzlocal = "*"
skyfield = "*"
jplephem = "*"
GaiaXPy = "^2.1.4"

# performance
numba = "*"

# neural net / GPU acceleration
# NOTE: PyTorch must be installed separately with the user's chosen backend:
# - CUDA: pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
# - CPU:  pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
onnx = "*"
# ONNX Runtime is deliberately user-managed. Choose exactly one provider in the
# active conda/venv environment (CPU, GPU, DirectML, or ORT nightly for
# datacenter GPUs); YETI must never force a provider or replace that choice.

# image formats & camera raw
xisf = "*"
rawpy = ">=0.26.0"
imageio = "*"

# PDF support
pypdfium2 = "*"

# utilities
pytz = "*"
py-cpuinfo = "*"

# GUI
PyQt6 = "*"
pyqtgraph = "*"

# system
psutil = "*"
"nvidia-ml-py" = {version = "*", markers = "sys_platform != 'darwin'"}

# computer vision
opencv-python-headless = "*"
scikit-image = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.extras]
# Optional extras can be added here if needed in the future

[tool.poetry.scripts]
setiastrosuitepro = "setiastro.saspro.__main__:main"
cosmicclarity = "setiastro.saspro.cli:main"
saspro-export-requirements = "ops.export_requirements:main"
saspro-write-build-info = "ops.write_build_info:main"
saspro-prime-matplotlib-cache = "ops.prime_matplotlib_cache:main"
